services:
  - type: web
    name: foodiefrenzy-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://foodiefrenzy-frontend.vercel.app,https://foodiefrenzy-admin.vercel.app
      - key: FRONTEND_URL
        value: https://foodiefrenzy-frontend.vercel.app
      - key: ADMIN_URL
        value: https://foodiefrenzy-admin.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@lakeshoreconvenience.com
